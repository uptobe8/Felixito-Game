<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Felixito Office Journey</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050814;color:#fff;font-family:Inter,Arial,sans-serif}canvas{display:block;width:100vw;height:100vh;background:#050814}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;z-index:5;pointer-events:none}.pill{background:rgba(2,6,23,.64);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:9px 13px;font-weight:900;box-shadow:0 18px 55px #0008;backdrop-filter:blur(12px)}.pill b{color:#ffd56a}.panel{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(980px,calc(100vw - 22px));background:rgba(3,7,18,.88);border:1px solid rgba(255,255,255,.28);border-radius:24px;padding:14px;z-index:10;box-shadow:0 30px 90px #000c}.panel h2{margin:0 0 6px;color:#ffd56a;font-size:22px}.panel p{margin:0 0 10px;color:#dbeafe;line-height:1.42}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button,.choice button{border:1px solid #475569;background:linear-gradient(#1f2937,#0f172a);color:#fff;border-radius:14px;padding:12px;font-weight:850;text-align:left;cursor:pointer}.actions button.primary{background:#ffd56a;color:#111;text-align:center;border-color:#ffd56a}.choice{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.choice button:hover,.actions button:hover{border-color:#ffd56a}.mini{position:fixed;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:6;max-width:48vw}.tag{background:rgba(2,6,23,.7);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 9px;color:#dbeafe;font-size:12px}.msg{position:fixed;top:74px;left:50%;transform:translateX(-50%);background:rgba(2,6,23,.7);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:9px 13px;color:#e5e7eb;z-index:6}.hide{display:none}@media(max-width:780px){.hud{font-size:12px;flex-wrap:wrap}.pill{padding:7px 9px}.choice,.actions{grid-template-columns:1fr}.panel{max-height:48vh;overflow:auto}.mini{display:none}.msg{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div class="pill">Felixito Office Journey</div><div class="pill">Guía: <b id="guide">Recepción</b></div><div class="pill">Sector: <b id="sector">sin elegir</b></div><div class="pill">Progreso: <b id="progress">0%</b></div></div>
<div class="msg" id="msg">Pulsa “Ir con la guía”. No necesitas saber marketing: el juego te lleva paso a paso.</div>
<div class="mini" id="inv"></div>
<div class="panel" id="panel"></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W=0,H=0,DPR=1;function resize(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const sectors={b2b:{name:'B2B / servicios profesionales',plain:'vendes a empresas o clientes que necesitan confiar antes de contratar',rec:{canal:'LinkedIn + SEO + lead magnet',activo:'Landing con formulario y llamada de diagnóstico',tools:'Webflow/Framer + HubSpot + Make',gpts:'Estratega + Copywriter + Ventas + Analista',auto:'Formulario → CRM → email → tarea comercial',metric:'leads, coste por lead y tasa de cierre'}},ecom:{name:'Tienda online / producto físico',plain:'vendes productos que se compran online',rec:{canal:'Instagram/TikTok + Google Shopping',activo:'tienda online con fichas de producto y carrito',tools:'Shopify + Canva/CapCut + Klaviyo/Brevo',gpts:'Copywriter + Contenido + Atención + Analista',auto:'carrito abandonado → email → cupón',metric:'ventas, CAC, ROAS y ticket medio'}},local:{name:'Negocio local',plain:'clínica, restaurante, peluquería, gimnasio, academia, taller o similar',rec:{canal:'Google Maps + reseñas + WhatsApp',activo:'perfil local optimizado + landing simple',tools:'Google Business + WhatsApp Business + Calendly',gpts:'Atención + Reseñas + Contenido local',auto:'reserva → recordatorio → reseña',metric:'reservas, llamadas y reseñas'}},edu:{name:'Cursos / formación',plain:'vendes cursos, clases, academias o mentorías',rec:{canal:'YouTube/Reels + lead magnet + email',activo:'landing de clase gratuita o webinar',tools:'Hotmart/Teachable + Canva + Synthesia',gpts:'Tutor + Copywriter + Vídeo + Analista',auto:'registro → recordatorios → oferta',metric:'registros, asistencia y ventas'}},alto:{name:'Alto ticket / inmobiliaria / reformas',plain:'vendes algo caro, complejo o personalizado',rec:{canal:'Google/Meta Ads + landing específica',activo:'formulario corto + llamada rápida',tools:'Webflow/Framer + HubSpot + WhatsApp',gpts:'Ventas + Objeciones + Seguimiento',auto:'lead → CRM → aviso inmediato → llamada',metric:'tiempo de respuesta, leads contactados y cierre'}},turismo:{name:'Restauración / turismo / experiencias',plain:'vendes reservas, experiencias, eventos o visitas',rec:{canal:'Google Maps + Instagram/TikTok',activo:'landing visual + reserva o WhatsApp',tools:'Canva + CapCut + WhatsApp Business',gpts:'Contenido + Atención + Reseñas',auto:'reserva → confirmación → reseña',metric:'reservas, recurrencia y reviews'}}};
const flow=[
{id:'sector',room:'Recepción',guide:'Laura, consultora inicial',title:'Primero entendemos tu negocio',text:'No hace falta que sepas marketing. Solo dime qué tipo de empresa estás montando y la guía te dirá qué construir primero.'},
{id:'canal',room:'Sala de estrategia',guide:'Diego, estratega de canales',title:'Dónde conseguir clientes',text:'Ahora elegimos el canal principal. No todos los negocios deben empezar por redes sociales.'},
{id:'activo',room:'Sala de arquitectura digital',guide:'Marta, arquitecta digital',title:'Qué activo digital necesitas',text:'Elegimos si necesitas landing, web, ecommerce, WhatsApp, webinar o CRM. La herramienta viene después.'},
{id:'tools',room:'Laboratorio de herramientas',guide:'Nora, especialista en herramientas',title:'Qué herramientas usar',text:'Seleccionamos pocas herramientas, no una lista enorme. Solo lo necesario para empezar.'},
{id:'gpts',room:'Sala de asistentes GPT',guide:'Hugo, diseñador de GPTs',title:'Qué chats GPT crear',text:'Crearemos chats especializados para ayudarte aunque no sepas marketing.'},
{id:'auto',room:'Sala de automatización',guide:'Irene, automatizadora',title:'Qué tarea automatizar primero',text:'Automatizamos lo repetitivo para que no pierdas leads ni citas.'},
{id:'metric',room:'Observatorio',guide:'Leo, analista',title:'Cómo saber si funciona',text:'Elegimos pocas métricas. Nada de mirar likes si el objetivo es vender.'},
{id:'final',room:'Despacho final',guide:'Laura, directora de estrategia',title:'Tu estrategia final',text:'Con todo lo elegido, la guía prepara un plan simple y accionable.'}
];
let S={step:0,sector:null,score:0,plan:{},mode:'intro'};let avatar={x:.24,y:.78,tx:.24,ty:.78,walk:0},npc={x:.66,y:.58};
function current(){return flow[S.step]}function rec(k){return sectors[S.sector].rec[k]}function alt(k){return {canal:['Publicar en cualquier red social sin plan','Hacer solo una web y esperar tráfico','Comprar anuncios sin landing'],activo:['Web genérica sin formulario','Solo perfil de Instagram','PDF sin forma de contacto'],tools:['Solo ChatGPT sin CRM ni canal','Usar demasiadas apps desde el día uno','Diseñar antes de saber el canal'],gpts:['Un único chat para todo','Solo generar posts','No usar GPTs especializados'],auto:['Hacer todo manual','Enviar mensajes cuando me acuerde','No guardar leads'],metric:['Likes y visualizaciones','Número de herramientas usadas','Publicaciones hechas sin ventas']}[k]||[]}
function ui(){document.getElementById('guide').textContent=current().room;document.getElementById('sector').textContent=S.sector?sectors[S.sector].name:'sin elegir';document.getElementById('progress').textContent=Math.round(S.step/(flow.length-1)*100)+'%';document.getElementById('inv').innerHTML=Object.entries(S.plan).map(([k,v])=>'<span class="tag">'+k+': '+v+'</span>').join('')}
function panelIntro(){const f=current();let html='<h2>'+f.title+'</h2><p><b>'+f.guide+':</b> '+f.text+'</p><div class="actions"><button class="primary" onclick="goGuide()">Ir con la guía</button><button onclick="talk()">Hablar</button></div>';document.getElementById('panel').innerHTML=html;ui()}
function goGuide(){avatar.tx=npc.x-.08;avatar.ty=npc.y+.14;document.getElementById('msg').textContent='Caminando hacia '+current().guide+'. También puedes tocar el suelo para moverte.'}
function talk(){if(Math.hypot(avatar.x-(npc.x-.08),avatar.y-(npc.y+.14))>.16){goGuide();document.getElementById('msg').textContent='Acércate un poco más. Te llevo automáticamente.';return}if(current().id==='sector')sectorDialog();else if(current().id==='final')finalDialog();else choiceDialog(current().id)}
function sectorDialog(){let html='<h2>¿Qué empresa estás creando?</h2><p>Elige la opción más parecida. La guía adaptará el plan a ese tipo de negocio.</p><div class="choice">';Object.entries(sectors).forEach(([k,v])=>html+='<button onclick="chooseSector(\''+k+'\')"><b>'+v.name+'</b><br><span style="color:#cbd5e1;font-weight:500">'+v.plain+'</span></button>');html+='</div>';document.getElementById('panel').innerHTML=html}
function chooseSector(k){S.sector=k;S.plan.sector=sectors[k].name;S.score+=10;next('Sector elegido. Ahora Diego te ayudará a decidir dónde conseguir clientes.')} 
function choiceDialog(k){let best=rec(k),options=[best,...alt(k)];let labels={canal:'canal principal',activo:'activo digital',tools:'herramientas',gpts:'chats GPT',auto:'automatización',metric:'métrica principal'};let html='<h2>Elige '+labels[k]+'</h2><p><b>'+current().guide+':</b> Para '+sectors[S.sector].name+', ¿qué opción tiene más sentido?</p><div class="choice">';options.forEach((o,i)=>html+='<button onclick="pick(\''+k+'\','+i+')">'+o+'</button>');html+='<button onclick="pick(\''+k+'\',0)">No lo sé, que la guía me recomiende</button></div>';document.getElementById('panel').innerHTML=html}
function pick(k,i){let best=rec(k),chosen=i===0?best:alt(k)[i-1];S.plan[k]=chosen;if(i===0)S.score+=20;else S.score+=5;const explain=i===0?'Correcto. Esta es la opción base para este sector.':'Puede hacerse, pero para empezar era más seguro: '+best;next(explain)}
function next(message){document.getElementById('msg').textContent=message;S.step=Math.min(S.step+1,flow.length-1);avatar.x=.24;avatar.y=.78;avatar.tx=.24;avatar.ty=.78;npc={x:.66,y:.58};panelIntro()}
function finalDialog(){let p=S.plan,s=sectors[S.sector];let text='ESTRATEGIA PARA '+s.name+'\n\n1. Punto de partida: '+s.plain+'.\n2. Canal principal: '+p.canal+'.\n3. Activo digital: '+p.activo+'.\n4. Herramientas: '+p.tools+'.\n5. GPTs de apoyo: '+p.gpts+'.\n6. Automatización inicial: '+p.auto+'.\n7. Métrica clave: '+p.metric+'.\n\nPrimeros 14 días:\n- Crear el activo digital.\n- Publicar 5 piezas de contenido orientadas al canal.\n- Activar el formulario/WhatsApp.\n- Registrar cada lead.\n- Revisar la métrica clave al final de la segunda semana.';document.getElementById('panel').innerHTML='<h2>Plan final generado</h2><p style="white-space:pre-wrap">'+text+'</p><div class="actions"><button class="primary" onclick="restart()">Nueva empresa</button><button onclick="navigator.clipboard&&navigator.clipboard.writeText(`'+text.replace(/`/g,'')+'`)">Copiar estrategia</button></div>'}
function restart(){S={step:0,sector:null,score:0,plan:{},mode:'intro'};avatar={x:.24,y:.78,tx:.24,ty:.78,walk:0};panelIntro()}
function draw(){ctx.clearRect(0,0,W,H);drawOffice();drawNPC();drawAvatar();requestAnimationFrame(draw)}
function drawOffice(){const f=current();let grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#eefbff');grd.addColorStop(.26,'#8fcbe0');grd.addColorStop(.62,'#6f7f8f');grd.addColorStop(1,'#07111f');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.84)';poly([[W*.11,H*.2],[W*.86,H*.16],[W*.9,H*.48],[W*.13,H*.48]]);ctx.fillStyle='rgba(255,255,255,.18)';poly([[W*.13,H*.48],[W*.9,H*.48],[W,H*.9],[0,H*.9]]);ctx.strokeStyle='rgba(255,255,255,.38)';ctx.lineWidth=1;for(let i=0;i<14;i++){let x=W*(.13+i*.06);ctx.beginPath();ctx.moveTo(x,H*.48);ctx.lineTo(W*.5+(i-7)*W*.12,H);ctx.stroke()}for(let y=H*.54;y<H;y+=H*.06){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle='rgba(17,24,39,.58)';round(W*.08,H*.26,W*.16,H*.22,20);ctx.fill();ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='900 '+Math.max(16,W*.018)+'px Arial';ctx.textAlign='center';ctx.fillText('Recepción',W*.16,H*.38);ctx.fillStyle='rgba(120,76,38,.9)';round(W*.1,H*.46,W*.23,H*.1,10);ctx.fill();drawPlant(W*.82,H*.48,Math.min(W,H)*.11);drawGlassRoom(W*.56,H*.25,W*.27,H*.23,f.room);ctx.fillStyle='rgba(255,255,255,.95)';ctx.shadowColor='#0008';ctx.shadowBlur=18;ctx.font='900 '+Math.max(24,W*.036)+'px Arial';ctx.fillText(f.room,W/2,H*.16);ctx.shadowBlur=0;ctx.fillStyle='rgba(255,213,106,.95)';ctx.font='800 '+Math.max(14,W*.014)+'px Arial';ctx.fillText('Objetivo actual: '+f.title,W/2,H*.205)}
function drawGlassRoom(x,y,w,h,label){ctx.save();ctx.shadowColor='#7dd3fc';ctx.shadowBlur=24;ctx.fillStyle='rgba(15,23,42,.44)';round(x,y,w,h,24);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.62)';ctx.lineWidth=2;ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='white';ctx.font='900 '+Math.max(14,W*.015)+'px Arial';ctx.textAlign='center';ctx.fillText(label,x+w/2,y+h/2);ctx.restore()}
function drawPlant(x,y,s){ctx.fillStyle='#7c5a3a';ctx.fillRect(x-s*.04,y,s*.08,s*.55);for(let i=0;i<7;i++){ctx.save();ctx.translate(x,y);ctx.rotate((i-3)*.42);ctx.fillStyle=i%2?'#168348':'#20a55d';ctx.beginPath();ctx.ellipse(0,-s*.18,s*.11,s*.42,0,0,Math.PI*2);ctx.fill();ctx.restore()}}
function drawNPC(){let x=W*npc.x,y=H*npc.y,s=Math.min(W,H)*.13;ctx.save();ctx.shadowColor='#0008';ctx.shadowBlur=18;ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x,y+s*.93,s*.33,s*.07,0,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#0f172a';round(x-s*.23,y-s*.02,s*.46,s*.72,s*.12);ctx.fill();ctx.fillStyle='#d8b094';ctx.beginPath();ctx.ellipse(x,y-s*.2,s*.18,s*.22,0,0,7);ctx.fill();ctx.fillStyle='#111827';ctx.fillRect(x-s*.2,y-s*.38,s*.4,s*.1);ctx.strokeStyle='#d8b094';ctx.lineWidth=Math.max(4,s*.055);ctx.beginPath();ctx.moveTo(x-s*.22,y+s*.18);ctx.lineTo(x-s*.42,y+s*.42);ctx.moveTo(x+s*.22,y+s*.18);ctx.lineTo(x+s*.42,y+s*.42);ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 '+Math.max(13,W*.014)+'px Arial';ctx.textAlign='center';ctx.fillText(current().guide,x,y-s*.48);ctx.restore()}
function drawAvatar(){avatar.x+=(avatar.tx-avatar.x)*.035;avatar.y+=(avatar.ty-avatar.y)*.035;let moving=Math.hypot(avatar.tx-avatar.x,avatar.ty-avatar.y)>.01;if(moving)avatar.walk+=.12;let x=W*avatar.x,y=H*avatar.y,s=Math.min(W,H)*.18,step=Math.sin(avatar.walk)*s*.08;ctx.save();ctx.translate(x,y);ctx.shadowColor='#0009';ctx.shadowBlur=22;ctx.fillStyle='rgba(0,0,0,.36)';ctx.beginPath();ctx.ellipse(0,s*.32,s*.34,s*.08,0,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#5b3526';ctx.beginPath();ctx.moveTo(-s*.2,-s*.55);ctx.quadraticCurveTo(0,-s*.86,s*.22,-s*.55);ctx.lineTo(s*.12,-s*.25);ctx.quadraticCurveTo(0,-s*.16,-s*.18,-s*.25);ctx.closePath();ctx.fill();ctx.fillStyle='#f8fafc';round(-s*.18,-s*.42,s*.36,s*.58,s*.13);ctx.fill();ctx.fillStyle='#d5aa89';ctx.beginPath();ctx.ellipse(-s*.25,-s*.18,s*.06,s*.26,.15,0,7);ctx.ellipse(s*.25,-s*.18,s*.06,s*.26,-.15,0,7);ctx.fill();ctx.fillStyle='#c8a172';ctx.beginPath();ctx.moveTo(-s*.16,s*.14);ctx.lineTo(-s*.02,s*.14);ctx.lineTo(-s*.07,s*.62+step);ctx.lineTo(-s*.22,s*.62);ctx.closePath();ctx.moveTo(s*.02,s*.14);ctx.lineTo(s*.16,s*.14);ctx.lineTo(s*.22,s*.62);ctx.lineTo(s*.07,s*.62-step);ctx.closePath();ctx.fill();ctx.restore()}
function poly(points){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}function round(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect();avatar.tx=(e.clientX-r.left)/W;avatar.ty=Math.min(.83,Math.max(.56,(e.clientY-r.top)/H))});panelIntro();draw();
</script>
</body>
</html>
