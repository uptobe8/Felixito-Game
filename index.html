<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Felixito Office Strategy</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Inter,Arial,sans-serif}.scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#eaf5f7 0 16%,#b8d5dc 17%,#1b2430 65%,#070b12)}.sky{position:absolute;inset:0 0 46% 0;background:linear-gradient(180deg,#eaf9ff,#a8d0df 58%,#d9b88a);filter:saturate(1.05)}.sun{position:absolute;right:12%;top:8%;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#fff 0 12%,#fff7 28%,transparent 70%);filter:blur(4px)}.office{position:absolute;left:50%;top:50%;width:min(1500px,120vw);height:min(880px,92vh);transform:translate(-50%,-50%);perspective:900px}.back{position:absolute;left:8%;right:8%;top:5%;height:48%;background:linear-gradient(90deg,#f5f1ea,#fff,#d7d9dc);clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);box-shadow:0 25px 80px #0004}.windows{position:absolute;left:15%;right:12%;top:8%;height:35%;background:linear-gradient(180deg,#bdeeff88,#ffffff35),url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420"><rect width="1200" height="420" fill="none"/><g fill="%23445"><rect x="90" y="185" width="55" height="160"/><rect x="165" y="145" width="70" height="200"/><rect x="270" y="105" width="90" height="240"/><rect x="410" y="165" width="55" height="180"/><rect x="515" y="90" width="105" height="255"/><rect x="680" y="135" width="80" height="210"/><rect x="820" y="70" width="120" height="275"/><rect x="1000" y="155" width="65" height="190"/></g></svg>');background-size:cover;border:6px solid #182333;box-shadow:inset 0 0 55px #fff8,0 25px 55px #0005}.windows:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 150px,#182333 154px 160px),linear-gradient(90deg,#ffffff55,transparent 35%,#ffffff25 65%,transparent)}.ceiling{position:absolute;left:9%;right:9%;top:-1%;height:18%;background:linear-gradient(#f7f4ed,#cabda7);clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);box-shadow:0 20px 65px #0003}.light{position:absolute;left:50%;top:8%;width:360px;height:42px;transform:translateX(-50%);border-radius:50%;background:#fff;box-shadow:0 0 50px #fff,0 20px 130px #ffd98a}.floor{position:absolute;left:-6%;right:-6%;bottom:-14%;height:60%;background:linear-gradient(120deg,#8b6a48,#d2b183 45%,#6d7782 100%);clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);box-shadow:inset 0 55px 80px #ffffff3d}.floor:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#ffffff55 1px,transparent 1px),linear-gradient(#ffffff55 1px,transparent 1px);background-size:118px 118px;transform:perspective(700px) rotateX(40deg);opacity:.55}.rug{position:absolute;left:35%;right:17%;bottom:16%;height:22%;background:radial-gradient(ellipse at center,#2b313b,#10141b);transform:skewX(-8deg);border-radius:42px;box-shadow:0 24px 60px #0008}.desk{position:absolute;left:13%;bottom:31%;width:360px;height:120px;background:linear-gradient(180deg,#d9c3a6,#8d633f);border-radius:12px;box-shadow:0 28px 65px #0009}.desk:before{content:'';position:absolute;left:35px;right:35px;top:-18px;height:25px;background:#f5efe7;border-radius:7px}.desk:after{content:'Recepción';position:absolute;left:0;right:0;top:43px;text-align:center;color:#34251a;font-weight:900;font-size:22px}.sofa{position:absolute;right:8%;bottom:31%;width:350px;height:125px;background:linear-gradient(180deg,#202833,#070a10);border-radius:36px 36px 18px 18px;box-shadow:0 26px 60px #000a}.sofa:before,.sofa:after{content:'';position:absolute;top:35px;width:68px;height:100px;background:#05080d;border-radius:26px}.sofa:before{left:-28px}.sofa:after{right:-28px}.plant{position:absolute;left:5%;bottom:25%;width:190px;height:310px}.pot{position:absolute;bottom:0;left:52px;width:90px;height:62px;background:linear-gradient(#9a6b45,#573a24);border-radius:0 0 28px 28px}.stem{position:absolute;bottom:55px;left:92px;width:16px;height:165px;background:#5a3d24;border-radius:16px}.leaf{position:absolute;left:90px;bottom:170px;width:150px;height:38px;background:linear-gradient(90deg,#0b3d25,#27a95d);border-radius:100% 0 100% 0;transform-origin:6px 20px;filter:drop-shadow(0 8px 7px #0004)}.l1{transform:rotate(-35deg)}.l2{transform:rotate(-80deg);bottom:145px}.l3{transform:rotate(30deg);bottom:130px}.l4{transform:rotate(-130deg);bottom:95px}.advisor,.avatar{position:absolute;bottom:23%;width:120px;height:300px;transition:left 1.6s cubic-bezier(.2,.8,.2,1),bottom 1.6s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 22px 26px #0009)}.advisor{left:62%}.avatar{left:27%}.person .head{position:absolute;left:36px;top:28px;width:56px;height:68px;background:linear-gradient(#d9b28f,#a96f4d);border-radius:50%}.person .hair{position:absolute;left:27px;top:12px;width:78px;height:78px;background:linear-gradient(135deg,#382316,#6d422b);border-radius:45% 45% 36% 36%}.person .body{position:absolute;left:23px;top:92px;width:80px;height:120px;background:linear-gradient(90deg,#f2f4f7,#c7cbd1);border-radius:34px 34px 16px 16px}.advisor .body{background:linear-gradient(90deg,#111827,#020617)}.person .legs{position:absolute;left:35px;top:205px;width:62px;height:92px;background:linear-gradient(90deg,#c8a371,#8f653d);clip-path:polygon(0 0,46% 0,40% 100%,8% 100%,20% 36%,55% 36%,74% 100%,100% 100%,88% 0)}.advisor .legs{background:#111827}.person .arm{position:absolute;top:110px;width:24px;height:95px;background:#d9b28f;border-radius:16px}.a1{left:5px;transform:rotate(12deg)}.a2{right:0;transform:rotate(-12deg)}.label{position:absolute;left:50%;top:0;transform:translate(-50%,-120%);background:#020617cc;border:1px solid #ffffff33;border-radius:999px;padding:6px 10px;font-weight:900;white-space:nowrap}.roomTitle{position:absolute;left:50%;top:15%;transform:translateX(-50%);font-size:clamp(28px,4vw,58px);font-weight:950;text-shadow:0 14px 40px #0009;text-align:center}.objective{position:absolute;left:50%;top:23%;transform:translateX(-50%);background:#02061799;border:1px solid #ffffff33;border-radius:999px;padding:9px 14px;color:#fff;font-weight:850}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;z-index:6;pointer-events:none}.pill{background:#020617aa;border:1px solid #ffffff33;border-radius:999px;padding:9px 13px;font-weight:900;backdrop-filter:blur(14px)}.pill b{color:#ffd56a}.panel{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(1000px,calc(100vw - 22px));max-height:48vh;overflow:auto;background:#030712ee;border:1px solid #ffffff3d;border-radius:24px;box-shadow:0 30px 90px #000d;padding:16px;z-index:8}.panel h2{margin:0 0 8px;color:#ffd56a}.panel p{margin:0 0 12px;color:#dbeafe;line-height:1.45}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}button{border:1px solid #475569;background:linear-gradient(#1e293b,#0f172a);color:#fff;border-radius:14px;padding:12px;text-align:left;font-weight:850;cursor:pointer}.primary{background:#ffd56a;color:#111;text-align:center;border-color:#ffd56a}.chips{position:fixed;left:12px;bottom:12px;z-index:7;display:flex;gap:6px;flex-wrap:wrap;max-width:50vw}.chip{background:#020617bb;border:1px solid #ffffff33;border-radius:999px;padding:6px 9px;color:#dbeafe;font-size:12px}.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#020617aa;border:1px solid #ffffff33;border-radius:999px;padding:9px 14px;z-index:7}@media(max-width:820px){.hud{font-size:12px;flex-wrap:wrap}.pill{padding:7px 9px}.office{width:125vw}.buttons,.choices{grid-template-columns:1fr}.panel{max-height:52vh}.chips,.toast{display:none}.desk,.sofa{transform:scale(.8)}.advisor,.avatar{bottom:27%;transform:scale(.82);transform-origin:bottom center}.roomTitle{top:18%}.objective{display:none}}</style></head><body><div class='scene'><div class='sky'></div><div class='sun'></div><div class='office'><div class='ceiling'></div><div class='back'></div><div class='windows'></div><div class='light'></div><div class='floor'></div><div class='rug'></div><div class='plant'><div class='pot'></div><div class='stem'></div><i class='leaf l1'></i><i class='leaf l2'></i><i class='leaf l3'></i><i class='leaf l4'></i></div><div class='desk'></div><div class='sofa'></div><div class='roomTitle' id='roomTitle'>Recepción</div><div class='objective' id='objective'>Objetivo actual</div><div class='advisor person' id='advisor'><div class='label' id='advisorName'>Laura</div><div class='hair'></div><div class='head'></div><div class='body'></div><div class='arm a1'></div><div class='arm a2'></div><div class='legs'></div></div><div class='avatar person' id='avatar'><div class='hair'></div><div class='head'></div><div class='body'></div><div class='arm a1'></div><div class='arm a2'></div><div class='legs'></div></div></div></div><div class='hud'><div class='pill'>Felixito Office Strategy</div><div class='pill'>Guía: <b id='guide'>Recepción</b></div><div class='pill'>Sector: <b id='sector'>sin elegir</b></div><div class='pill'>Progreso: <b id='progress'>0%</b></div></div><div class='toast' id='toast'>Pulsa “Ir con la guía”. El recorrido es guiado.</div><div class='chips' id='chips'></div><div class='panel' id='panel'></div><script>const sectors={b2b:{name:'B2B / servicios profesionales',plain:'vendes a empresas o clientes que necesitan confiar antes de contratar',rec:{canal:'LinkedIn + SEO + lead magnet',activo:'Landing con formulario y llamada de diagnóstico',tools:'Webflow/Framer + HubSpot + Make',gpts:'Estratega + Copywriter + Ventas + Analista',auto:'Formulario → CRM → email → tarea comercial',metric:'leads, coste por lead y tasa de cierre'}},ecom:{name:'Tienda online / producto físico',plain:'vendes productos que se compran online',rec:{canal:'Instagram/TikTok + Google Shopping',activo:'tienda online con fichas de producto y carrito',tools:'Shopify + Canva/CapCut + Klaviyo/Brevo',gpts:'Copywriter + Contenido + Atención + Analista',auto:'carrito abandonado → email → cupón',metric:'ventas, CAC, ROAS y ticket medio'}},local:{name:'Negocio local',plain:'clínica, restaurante, peluquería, gimnasio, academia, taller o similar',rec:{canal:'Google Maps + reseñas + WhatsApp',activo:'perfil local optimizado + landing simple',tools:'Google Business + WhatsApp Business + Calendly',gpts:'Atención + Reseñas + Contenido local',auto:'reserva → recordatorio → reseña',metric:'reservas, llamadas y reseñas'}},edu:{name:'Cursos / formación',plain:'vendes cursos, clases, academias o mentorías',rec:{canal:'YouTube/Reels + lead magnet + email',activo:'landing de clase gratuita o webinar',tools:'Hotmart/Teachable + Canva + Synthesia',gpts:'Tutor + Copywriter + Vídeo + Analista',auto:'registro → recordatorios → oferta',metric:'registros, asistencia y ventas'}},alto:{name:'Alto ticket / inmobiliaria / reformas',plain:'vendes algo caro, complejo o personalizado',rec:{canal:'Google/Meta Ads + landing específica',activo:'formulario corto + llamada rápida',tools:'Webflow/Framer + HubSpot + WhatsApp',gpts:'Ventas + Objeciones + Seguimiento',auto:'lead → CRM → aviso inmediato → llamada',metric:'tiempo de respuesta, leads contactados y cierre'}},turismo:{name:'Restauración / turismo / experiencias',plain:'vendes reservas, experiencias, eventos o visitas',rec:{canal:'Google Maps + Instagram/TikTok',activo:'landing visual + reserva o WhatsApp',tools:'Canva + CapCut + WhatsApp Business',gpts:'Contenido + Atención + Reseñas',auto:'reserva → confirmación → reseña',metric:'reservas, recurrencia y reviews'}}};const flow=[['sector','Recepción','Laura','Primero entendemos tu negocio','No necesitas saber marketing. La guía te pregunta lo mínimo y decide contigo.'],['canal','Sala de estrategia','Diego','Dónde conseguir clientes','Elegimos el canal principal. No todos los negocios deben empezar por redes sociales.'],['activo','Arquitectura digital','Marta','Qué activo digital necesitas','Definimos si necesitas landing, tienda, WhatsApp, webinar o CRM.'],['tools','Laboratorio de herramientas','Nora','Qué herramientas usar','Usamos pocas herramientas, no una lista infinita.'],['gpts','Sala GPT','Hugo','Qué asistentes crear','Creamos chats útiles: estrategia, copy, ventas, atención y análisis.'],['auto','Automatización','Irene','Qué automatizar primero','Automatizamos el primer seguimiento para no perder oportunidades.'],['metric','Observatorio','Leo','Cómo saber si funciona','Elegimos métricas de negocio, no métricas vanidosas.'],['final','Despacho final','Laura','Tu estrategia final','La guía genera un plan simple para empezar en 14 días.']];let S={step:0,sector:null,plan:{},score:0};const $=id=>document.getElementById(id);function cur(){return flow[S.step]}function rec(k){return sectors[S.sector].rec[k]}function alt(k){return{canal:['Publicar al azar en redes','Hacer solo una web y esperar','Comprar anuncios sin landing'],activo:['Web genérica sin formulario','Solo Instagram','PDF sin contacto'],tools:['Solo ChatGPT sin CRM','Demasiadas apps desde el día uno','Diseñar antes de saber el canal'],gpts:['Un único chat para todo','Solo generar posts','No crear asistentes'],auto:['Todo manual','Responder cuando me acuerde','No guardar leads'],metric:['Likes','Número de publicaciones','Herramientas usadas']}[k]||[]}function ui(){let f=cur();$('guide').textContent=f[1];$('sector').textContent=S.sector?sectors[S.sector].name:'sin elegir';$('progress').textContent=Math.round(S.step/(flow.length-1)*100)+'%';$('roomTitle').textContent=f[1];$('objective').textContent='Objetivo: '+f[3];$('advisorName').textContent=f[2];$('chips').innerHTML=Object.entries(S.plan).map(([k,v])=>'<span class=chip>'+k+': '+v+'</span>').join('')}function panel(){let f=cur();$('panel').innerHTML='<h2>'+f[3]+'</h2><p><b>'+f[2]+':</b> '+f[4]+'</p><div class=buttons><button class=primary onclick=walk()>Ir con la guía</button><button onclick=talk()>Hablar</button></div>';ui()}function walk(){$('avatar').style.left='54%';$('toast').textContent='La guía te acompaña. Cuando llegues, pulsa Hablar.'}function talk(){if(cur()[0]==='sector')sectorDialog();else if(cur()[0]==='final')finalPlan();else choice(cur()[0])}function sectorDialog(){let h='<h2>¿Qué empresa estás montando?</h2><p>Elige la opción más parecida. No tiene que ser perfecta.</p><div class=choices>';Object.entries(sectors).forEach(([k,v])=>h+='<button onclick="choose(\''+k+'\')"><b>'+v.name+'</b><br><span style="color:#cbd5e1;font-weight:500">'+v.plain+'</span></button>');$('panel').innerHTML=h+'</div>'}function choose(k){S.sector=k;S.plan.sector=sectors[k].name;S.score+=10;next('Sector elegido. Ahora elegimos dónde conseguir clientes.')}function choice(k){let labels={canal:'canal principal',activo:'activo digital',tools:'herramientas',gpts:'asistentes GPT',auto:'automatización',metric:'métrica'};let opts=[rec(k),...alt(k)];let h='<h2>Elige '+labels[k]+'</h2><p>Para '+sectors[S.sector].name+', la guía te deja decidir o recomendará la opción segura.</p><div class=choices>';opts.forEach((o,i)=>h+='<button onclick="pick(\''+k+'\','+i+')">'+o+'</button>');h+='<button onclick="pick(\''+k+'\',0)">No lo sé, que recomiende la guía</button></div>';$('panel').innerHTML=h}function pick(k,i){let v=i===0?rec(k):alt(k)[i-1];S.plan[k]=v;S.score+=i===0?20:5;next(i===0?'Decisión correcta.' :'La guía lo acepta, pero la recomendación más segura era: '+rec(k))}function next(msg){$('toast').textContent=msg;S.step=Math.min(S.step+1,flow.length-1);$('avatar').style.left='27%';panel()}function finalPlan(){let p=S.plan,s=sectors[S.sector];let text='ESTRATEGIA PARA '+s.name+'\n\n1. Negocio: '+s.plain+'.\n2. Canal principal: '+p.canal+'.\n3. Activo digital: '+p.activo+'.\n4. Herramientas: '+p.tools+'.\n5. GPTs: '+p.gpts+'.\n6. Automatización: '+p.auto+'.\n7. Métrica clave: '+p.metric+'.\n\nPrimeros 14 días:\n- Crear el activo digital.\n- Preparar 5 contenidos para el canal elegido.\n- Activar formulario, WhatsApp o reserva.\n- Registrar cada lead.\n- Revisar la métrica clave al día 14.';$('panel').innerHTML='<h2>Plan final generado</h2><p style="white-space:pre-wrap">'+text+'</p><div class=buttons><button class=primary onclick=restart()>Nueva empresa</button><button onclick="navigator.clipboard&&navigator.clipboard.writeText(`'+text.replace(/`/g,'')+'`)">Copiar estrategia</button></div>'}function restart(){S={step:0,sector:null,plan:{},score:0};$('avatar').style.left='27%';panel()}panel();</script></body></html>
