<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Felixito Game - Aventura 3D Marketing IA</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030712;color:#eef4ff;font-family:Inter,Arial,sans-serif}canvas{display:block;width:100vw;height:100vh;background:#000}.hud{position:fixed;top:10px;left:10px;right:10px;z-index:5;display:flex;gap:8px;justify-content:space-between;pointer-events:none}.pill{background:rgba(3,7,18,.72);border:1px solid rgba(148,163,184,.45);box-shadow:0 18px 60px #000a,inset 0 1px 0 #ffffff26;backdrop-filter:blur(12px);border-radius:999px;padding:9px 13px;font-weight:800}.pill b{color:#facc15}.dlg{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(1040px,calc(100vw - 22px));max-height:50vh;overflow:auto;background:rgba(6,12,24,.92);border:1px solid rgba(226,232,240,.35);box-shadow:0 28px 90px #000d,inset 0 1px 0 #ffffff22;border-radius:22px;padding:16px;z-index:10}.dlg.hide{display:none}.dlg h2{margin:0 40px 8px 0;color:#facc15}.dlg p{margin:0 0 12px;color:#dbeafe;line-height:1.45;white-space:pre-wrap}.x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:1px solid #64748b;background:#0f172a;color:white;font-weight:900}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.opts button{border:1px solid rgba(148,163,184,.45);background:linear-gradient(180deg,#1e293b,#0f172a);color:#fff;border-radius:14px;padding:12px;text-align:left;font-weight:800}.opts button:hover{border-color:#facc15;box-shadow:0 0 0 1px #facc1555}.inv{position:fixed;left:12px;bottom:12px;z-index:6;display:flex;gap:6px;flex-wrap:wrap;max-width:58vw;pointer-events:none}.tag{padding:6px 9px;border-radius:999px;border:1px solid #64748b;background:#020617cc;color:#dbeafe;font-size:12px}.hint{position:fixed;right:12px;bottom:12px;z-index:6;background:#020617cc;border:1px solid #64748b;border-radius:14px;padding:9px 11px;color:#cbd5e1}@media(max-width:760px){.hud{font-size:12px;flex-wrap:wrap}.pill{padding:7px 9px}.opts{grid-template-columns:1fr}.dlg{bottom:8px;max-height:56vh}.hint,.inv{display:none}}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="pill">Felixito Game 3D</div><div class="pill">Sector: <b id="hs">sin elegir</b></div><div class="pill">Puntos: <b id="hp">0</b></div><div class="pill">Zona: <b id="hz">Recepción</b></div></div><div id="inv" class="inv"></div><div class="hint">Clic en objetos/personajes. Clic en puerta para cambiar de zona.</div><div id="dlg" class="dlg"><button class="x" onclick="closeD()">×</button><h2 id="dt">Recepción inmersiva</h2><p id="dp">Explora la academia 3D. Habla con la directora, elige sector y entra en cada sala para construir la estrategia.</p><div id="op" class="opts"><button onclick="closeD()">Empezar</button></div></div><script>const cv=document.getElementById('c'),g=cv.getContext('2d');const W=1280,H=720;let sc=1,ox=0,oy=0,mouse={x:-1,y:-1},t=0;function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);sc=Math.min(innerWidth/W,innerHeight/H);ox=(innerWidth-W*sc)/2;oy=(innerHeight-H*sc)/2}addEventListener('resize',fit);fit();const DATA={sectors:{b2b:{n:'B2B / consultoría',brief:'venta compleja: autoridad, lead magnet, email y llamada',best:{canal:'LinkedIn + SEO + lead magnet',activo:'Landing con formulario y llamada',tools:'Webflow + HubSpot + Make',gpts:'Estratega + Copywriter + Ventas + Analista',auto:'Formulario → CRM → email → tarea comercial',metric:'Leads, CPL y tasa de cierre'}},ecom:{n:'B2C ecommerce',brief:'producto visual: tienda, social commerce y recuperación de carrito',best:{canal:'TikTok/Instagram + Google Shopping',activo:'Tienda online con fichas y carrito',tools:'Shopify + Canva + Klaviyo',gpts:'Copywriter + Contenido + Atención + Analista',auto:'Carrito abandonado → email → cupón',metric:'Ventas, CAC, ROAS y ticket medio'}},edu:{n:'Educación / cursos',brief:'contenido gratuito, lead magnet, webinar y email',best:{canal:'YouTube/Reels + lead magnet',activo:'Landing de clase gratuita o webinar',tools:'Hotmart/Teachable + Canva + Synthesia',gpts:'Tutor + Copywriter + Vídeo + Analista',auto:'Registro → recordatorios → oferta',metric:'Registros, asistencia y ventas'}},local:{n:'Negocio local',brief:'Maps, reseñas, WhatsApp y reservas',best:{canal:'Google Maps + reseñas + WhatsApp',activo:'Perfil local + landing simple',tools:'Google Business + WhatsApp + Calendly',gpts:'Atención + Reseñas + Contenido local',auto:'Reserva → recordatorio → reseña',metric:'Reservas, llamadas y reseñas'}},alto:{n:'Inmobiliaria / reformas / alto ticket',brief:'landing específica, llamada rápida y CRM',best:{canal:'Google/Meta Ads + landing específica',activo:'Formulario corto + llamada de diagnóstico',tools:'Framer/Webflow + HubSpot + WhatsApp',gpts:'Ventas + Objeciones + Seguimiento',auto:'Lead → CRM → aviso inmediato → llamada',metric:'Tiempo de respuesta y cierre'}},turismo:{n:'Restauración / turismo',brief:'visual, reservas, Google Maps y reseñas',best:{canal:'Google Maps + Instagram/TikTok',activo:'Carta/reserva + landing visual',tools:'Canva + CapCut + WhatsApp Business',gpts:'Contenido + Atención + Reseñas',auto:'Reserva → confirmación → reseña',metric:'Reservas, recurrencia y reviews'}},industria:{n:'Industria tradicional',brief:'autoridad, catálogo, presupuesto, CRM y seguimiento',best:{canal:'SEO + LinkedIn + ferias/email B2B',activo:'Web corporativa + catálogo descargable',tools:'Webflow + HubSpot + Airtable',gpts:'Estratega + Técnico + Ventas + Analista',auto:'Presupuesto → CRM → ficha interna',metric:'Solicitudes, CPL y pipeline'}}},choices:{canal:['LinkedIn + SEO + lead magnet','TikTok/Instagram + Google Shopping','Google Maps + reseñas + WhatsApp','YouTube/Reels + lead magnet','Google/Meta Ads + landing específica','SEO + LinkedIn + ferias/email B2B','Publicar al azar sin CTA'],activo:['Landing con formulario y llamada','Tienda online con fichas y carrito','Perfil local + landing simple','Landing de clase gratuita o webinar','Formulario corto + llamada de diagnóstico','Web corporativa + catálogo descargable','Web genérica sin CTA'],tools:['Webflow + HubSpot + Make','Shopify + Canva + Klaviyo','Hotmart/Teachable + Canva + Synthesia','Google Business + WhatsApp + Calendly','Framer/Webflow + HubSpot + WhatsApp','Webflow + HubSpot + Airtable','Solo ChatGPT sin CRM ni canal'],gpts:['Estratega + Copywriter + Ventas + Analista','Copywriter + Contenido + Atención + Analista','Tutor + Copywriter + Vídeo + Analista','Atención + Reseñas + Contenido local','Ventas + Objeciones + Seguimiento','Estratega + Técnico + Ventas + Analista','Un chat genérico para todo'],auto:['Formulario → CRM → email → tarea comercial','Carrito abandonado → email → cupón','Registro → recordatorios → oferta','Reserva → recordatorio → reseña','Lead → CRM → aviso inmediato → llamada','Presupuesto → CRM → ficha interna','Todo manual sin seguimiento'],metric:['Leads, CPL y tasa de cierre','Ventas, CAC, ROAS y ticket medio','Registros, asistencia y ventas','Reservas, llamadas y reseñas','Tiempo de respuesta y cierre','Solicitudes, CPL y pipeline','Likes sin ventas ni leads']}};let S={scene:'lobby',sector:null,score:0,bag:{},done:{}},hot=[];const zones={lobby:{n:'Recepción',title:'Recepción Ejecutiva IA',pal:['#101827','#1e3a5f','#6b7280'],spots:[['mentor','Directora Clara',760,330,130,250,'mentor'],['atrium','Atrio',1060,250,150,250,'to']]},atrium:{n:'Atrio',title:'Campus de Estrategia Digital',pal:['#07111f','#1f2937','#475569'],spots:[['canal','Canales',115,265,130,265,'to'],['activo','Activos',300,245,140,285,'to'],['tools','Herramientas',500,235,155,295,'to'],['gpts','GPTs',720,235,150,295,'to'],['auto','Automatización',930,245,160,285,'to'],['metric','Métricas',540,88,180,110,'to'],['final','Estrategia final',1050,80,130,165,'to']]},canal:{n:'Canales',title:'Sala de Canales de Captación',pal:['#0b1f33','#183e63','#334155'],mission:'canal'},activo:{n:'Activos',title:'Taller de Activos Digitales',pal:['#1f140b','#5b3418','#7c4a25'],mission:'activo'},tools:{n:'Herramientas',title:'Laboratorio de Herramientas IA',pal:['#09111f','#1e293b','#475569'],mission:'tools'},gpts:{n:'GPTs',title:'Biblioteca de GPTs Especializados',pal:['#120a2a','#312e81','#6d28d9'],mission:'gpts'},auto:{n:'Automatización',title:'Fábrica de Automatización',pal:['#1b0b07','#431407','#ea580c'],mission:'auto'},metric:{n:'Métricas',title:'Observatorio de Métricas',pal:['#02111e','#075985','#38bdf8'],mission:'metric'},final:{n:'Final',title:'Despacho de Estrategia',pal:['#191007','#422006','#a16207'],final:true}};function p(x,y){return [x,y]}function poly(c,a){g.fillStyle=c;g.beginPath();a.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fill()}function grad(x1,y1,x2,y2,a,b){let gr=g.createLinearGradient(x1,y1,x2,y2);gr.addColorStop(0,a);gr.addColorStop(1,b);return gr}function txt(s,x,y,z,c='#fff',al='center'){g.fillStyle=c;g.font='700 '+z+'px Inter,Arial';g.textAlign=al;g.fillText(s,x,y)}function room(z){let pa=z.pal,sky=grad(0,0,0,H,pa[1],pa[0]);g.fillStyle=sky;g.fillRect(0,0,W,H);poly(grad(0,0,W,0,'#020617',pa[1]),[p(0,0),p(W,0),p(880,210),p(400,210)]);poly(grad(0,0,W,0,'#050816',pa[0]),[p(0,0),p(400,210),p(390,485),p(0,H)]);poly(grad(W,0,0,0,'#050816',pa[0]),[p(W,0),p(880,210),p(890,485),p(W,H)]);poly(grad(0,380,0,H,pa[2],pa[0]),[p(390,485),p(890,485),p(W,H),p(0,H)]);for(let i=0;i<18;i++){let x=390+i*29;g.strokeStyle='rgba(255,255,255,.08)';g.beginPath();g.moveTo(x,485);g.lineTo(W/2,260);g.stroke()}for(let y=505;y<720;y+=38){g.strokeStyle='rgba(0,0,0,.35)';g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}g.shadowColor='#93c5fd';g.shadowBlur=30;g.fillStyle='rgba(240,249,255,.65)';g.beginPath();g.ellipse(W/2,118,210,28,0,0,7);g.fill();g.shadowBlur=0;txt(z.title,W/2,76,30,'#f8fafc');drawDepthDoors(z)}function drawDepthDoors(z){if(z.scene==='atrium'){[['Canales',120],['Activos',310],['Tools',520],['GPTs',735],['Auto',955]].forEach(([l,x])=>door3(x,255,115,250,l));door3(590,95,170,105,'Métricas');door3(1080,90,100,150,'Final')}else if(z.scene!=='lobby')door3(80,260,120,250,'Atrio')}function door3(x,y,w,h,l){let gr=grad(x,y,x+w,y+h,'#111827','#020617');g.fillStyle=gr;g.shadowColor='#000';g.shadowBlur=20;g.fillRect(x,y,w,h);g.shadowBlur=0;g.strokeStyle='rgba(226,232,240,.35)';g.lineWidth=2;g.strokeRect(x,y,w,h);txt(l,x+w/2,y+h+24,15,'#facc15')}function person(x,y,s,col,name){g.save();g.translate(x,y);g.scale(s,s);g.shadowColor='#000';g.shadowBlur=25;g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.ellipse(0,136,45,13,0,0,7);g.fill();let suit=grad(-20,35,20,130,col,'#050505');g.fillStyle=suit;g.beginPath();g.moveTo(-32,38);g.lineTo(32,38);g.lineTo(45,126);g.lineTo(-45,126);g.closePath();g.fill();g.fillStyle='#d9b08c';g.beginPath();g.ellipse(0,5,24,30,0,0,7);g.fill();g.fillStyle='#111827';g.fillRect(-26,-20,52,16);g.fillStyle='rgba(255,255,255,.88)';g.beginPath();g.arc(-8,2,3,0,7);g.arc(8,2,3,0,7);g.fill();g.strokeStyle='#1f2937';g.lineWidth=3;g.beginPath();g.moveTo(-7,16);g.quadraticCurveTo(0,21,8,16);g.stroke();g.strokeStyle='#111827';g.lineWidth=10;g.beginPath();g.moveTo(-18,126);g.lineTo(-25,178);g.moveTo(18,126);g.lineTo(25,178);g.stroke();g.strokeStyle='#d9b08c';g.lineWidth=8;g.beginPath();g.moveTo(-36,55);g.lineTo(-60,98);g.moveTo(36,55);g.lineTo(62,95);g.stroke();g.restore();txt(name,x,y-38,14,'#e5e7eb')}function panelsForScene(){hot=[];let z=zones[S.scene];if(z.spots)z.spots.forEach(a=>hot.push({id:a[0],label:a[1],x:a[2],y:a[3],w:a[4],h:a[5],type:a[6]}));if(z.mission){hot.push({id:z.mission,label:'Hablar con especialista',x:760,y:300,w:130,h:250,type:'mission'});hot.push({id:'atrium',label:'Volver al Atrio',x:60,y:260,w:150,h:250,type:'to'})}if(z.final){hot.push({id:'final',label:'Mesa de Estrategia',x:550,y:285,w:260,h:210,type:'final'});hot.push({id:'atrium',label:'Volver al Atrio',x:60,y:260,w:150,h:250,type:'to'})}}function drawScene(){let z=zones[S.scene];z.scene=S.scene;room(z);if(S.scene==='lobby'){person(805,410,1.05,'#111827','Directora');drawGlassCard(300,235,250,170,'Expediente\ndel cliente')}else if(S.scene==='atrium'){drawHolo(640,345,'Mapa del campus')}else if(z.mission){person(815,420,1.08,z.pal[2],'Especialista');drawGlassCard(320,245,330,180,z.title.replace(' de ','\nde '))}else if(z.final){person(860,420,1.08,'#065f46','Cliente');drawGlassCard(360,260,390,185,'PLAN\nESTRATEGICO')}drawHot()}function drawGlassCard(x,y,w,h,label){g.save();g.shadowColor='#000';g.shadowBlur=35;g.fillStyle='rgba(15,23,42,.55)';g.fillRect(x,y,w,h);g.shadowBlur=0;g.strokeStyle='rgba(226,232,240,.4)';g.strokeRect(x,y,w,h);label.split('\n').forEach((l,i)=>txt(l,x+w/2,y+62+i*42,30,'#f8fafc'));g.restore()}function drawHolo(x,y,label){g.save();g.shadowColor='#38bdf8';g.shadowBlur=35;g.strokeStyle='rgba(56,189,248,.8)';for(let i=0;i<5;i++){g.beginPath();g.ellipse(x,y+i*18,150-i*12,34,0,0,7);g.stroke()}g.shadowBlur=0;txt(label,x,y-64,22,'#bfdbfe');g.restore()}function drawHot(){let h=hit(mouse.x,mouse.y);hot.forEach(o=>{if(o===h){g.strokeStyle='#facc15';g.lineWidth=3;g.strokeRect(o.x,o.y,o.w,o.h);g.fillStyle='rgba(2,6,23,.78)';g.fillRect(o.x,o.y-34,Math.max(120,o.label.length*8),28);txt(o.label,o.x+Math.max(120,o.label.length*8)/2,o.y-14,15,'#fff')}});cv.style.cursor=h?'pointer':'crosshair'}function draw(){g.clearRect(0,0,innerWidth,innerHeight);g.fillStyle='#000';g.fillRect(0,0,innerWidth,innerHeight);g.save();g.translate(ox,oy);g.scale(sc,sc);drawScene();g.restore();t++}function local(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/sc,y:(e.clientY-r.top-oy)/sc}}cv.onpointermove=e=>mouse=local(e);cv.onpointerdown=e=>{let m=local(e),h=hit(m.x,m.y);if(h)act(h)};function hit(x,y){return hot.find(o=>x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h)}function act(h){if(h.type==='to'){S.scene=h.id;ui();closeD();return}if(h.type==='mentor')mentor();if(h.type==='mission')mission(h.id);if(h.type==='final')finish()}function ui(){document.getElementById('hs').textContent=S.sector?DATA.sectors[S.sector].n:'sin elegir';document.getElementById('hp').textContent=S.score;document.getElementById('hz').textContent=zones[S.scene].n;let inv=document.getElementById('inv');inv.innerHTML='';Object.entries(S.bag).forEach(([k,v])=>{let s=document.createElement('span');s.className='tag';s.textContent=k+': '+v;inv.appendChild(s)});panelsForScene()}function dialog(t,p,ops){let d=document.getElementById('dlg');d.classList.remove('hide');document.getElementById('dt').textContent=t;document.getElementById('dp').textContent=p;let o=document.getElementById('op');o.innerHTML='';ops.forEach(a=>{let b=document.createElement('button');b.textContent=a[0];b.onclick=a[1];o.appendChild(b)})}function closeD(){document.getElementById('dlg').classList.add('hide')}function mentor(){dialog('Directora Clara','Elige el tipo de cliente. La estrategia cambia por canal, ticket, forma de decisión y velocidad de cierre.',Object.entries(DATA.sectors).map(([k,v])=>[v.n,()=>{S.sector=k;S.score+=10;S.bag.sector=v.n;S.done.sector=1;S.scene='atrium';ui();dialog(v.n,'Brief: '+v.brief+'\n\nEntra en cada sala para construir canal, activo, herramientas, GPTs, automatización y métrica.',[['Continuar',closeD]])}]))}function mission(id){if(!S.sector){dialog('Falta elegir sector','Vuelve a recepción y habla con la Directora Clara.',[['Cerrar',closeD]]);return}let order=['canal','activo','tools','gpts','auto','metric'],i=order.indexOf(id);if(i>0&&!S.done[order[i-1]]){dialog('Orden bloqueado','Primero completa: '+order[i-1]+'.',[['Cerrar',closeD]]);return}dialog('Decisión: '+id,'Sector: '+DATA.sectors[S.sector].n+'\nElige la pieza más coherente con el plan.',DATA.choices[id].map(v=>[v,()=>pick(id,v)]))}function pick(id,v){let best=DATA.sectors[S.sector].best[id],bad=/azar|genérica|Solo|manual|Likes|genérico/.test(v),pts=v===best?20:(bad?-8:8);S.score=Math.max(0,S.score+pts);S.bag[id]=v;S.done[id]=1;ui();dialog((pts>0?'+':'')+pts+' puntos',v===best?'Correcto. Encaja con el sector y el plan.':pts>0?'Aceptable. Mejor opción: '+best:'Incorrecto. Mejor opción: '+best,[['Volver al atrio',()=>{S.scene='atrium';ui();closeD()}]])}function finish(){let miss=['sector','canal','activo','tools','gpts','auto','metric'].filter(k=>!S.bag[k]);if(miss.length){dialog('Plan incompleto','Falta: '+miss.join(', '),[['Cerrar',closeD]]);return}let s=DATA.sectors[S.sector];dialog('Estrategia final','SECTOR: '+s.n+'\n\nCANAL: '+S.bag.canal+'\nACTIVO: '+S.bag.activo+'\nHERRAMIENTAS: '+S.bag.tools+'\nGPTS: '+S.bag.gpts+'\nAUTOMATIZACION: '+S.bag.auto+'\nMETRICA: '+S.bag.metric+'\n\nPUNTOS: '+S.score,[['Nueva partida',()=>{S={scene:'lobby',sector:null,score:0,bag:{},done:{}};ui();closeD()}]])}function loop(){draw();requestAnimationFrame(loop)}ui();loop();</script></body></html>
