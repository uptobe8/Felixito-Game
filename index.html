s:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:10px;justify-content:space-between}.pill{background:#020617aa;border:1px solid #ffffff44;border-radius:999px;padding:10px 14px;font-weight:900;backdrop-filter:blur(12px)}.pill b{color:#ffd56a}.inv{position:absolute;bottom:12px;left:12px;display:flex;gap:7px;flex-wrap:wrap;max-width:60vw}.tag{background:#020617bb;border:1px solid #ffffff33;border-radius:999px;padding:7px 10px;color:#dbeafe;font-size:12px}.hint{position:absolute;bottom:12px;right:12px;background:#020617bb;border:1px solid #ffffff33;border-radius:16px;padding:10px 12px;color:#dbeafe}.dlg{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(980px,calc(100vw - 22px));max-height:52vh;overflow:auto;background:#030712ee;border:1px solid #ffffff44;border-radius:22px;box-shadow:0 30px 90px #000d;padding:16px;z-index:40}.dlg.hide{display:none}.dlg h2{margin:0 40px 8px 0;color:#ffd56a}.dlg p{white-space:pre-wrap;color:#dbeafe}.x{position:absolute;right:12px;top:12px;border:1px solid #64748b;background:#020617;color:#fff;border-radius:99px;width:34px;height:34px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.opts button{border:1px solid #475569;background:linear-gradient(#1f2937,#0f172a);color:#fff;border-radius:14px;padding:12px;text-align:left;font-weight:800}.opts button:hover{border-color:#ffd56a}@media(max-width:850px){.stage{transform:translate(-50%,-50%) scale(.82)}.top{flex-wrap:wrap;font-size:12px}.opts{grid-template-columns:1fr}.hint,.inv{display:none}}</style></head><body><div class="world"><div class="stage"><div class="roof"></div><div class="back"></div><div class="wallL"></div><div class="wallR"></div><div class="floor"></div><div class="plant"><div class="trunk"></div><i class="leaf l1"></i><i class="leaf l2"></i><i class="leaf l3"></i><i class="leaf l4"></i></div><div id="layer"></div><div class="avatar"><div class="hair"></div><div class="head"></div><div class="torso"></div><div class="arm a1"></div><div class="arm a2"></div><div class="legs"></div></div></div></div><div class="ui"><div class="top"><div class="pill">Felixito Metaverse Office</div><div class="pill">Sector: <b id="sec">sin elegir</b></div><div class="pill">Puntos: <b id="pts">0</b></div><div class="pill">Zona: <b id="zone">Lobby</b></div></div><div class="inv" id="inv"></div><div class="hint">Haz clic en portales o especialistas</div></div><div class="dlg" id="dlg"><button class="x" onclick="closeDlg()">×</button><h2 id="dt">Lobby de Digitalización IA</h2><p id="dp">Entra en la oficina metaverso. Habla con la especialista de recepción para elegir sector y visita las salas.</p><div class="opts" id="opts"><button onclick="closeDlg()">Empezar</button></div></div><script>const DATA={sectors:{b2b:{n:'B2B / consultoría',brief:'autoridad, lead magnet, email y llamada',best:{canal:'LinkedIn + SEO + lead magnet',activo:'Landing con formulario y llamada',tools:'Webflow + HubSpot + Make',gpts:'Estratega + Copywriter + Ventas + Analista',auto:'Formulario → CRM → email → tarea comercial',metric:'Leads, CPL y tasa de cierre'}},ecom:{n:'B2C ecommerce',brief:'tienda, social commerce y carrito',best:{canal:'TikTok/Instagram + Google Shopping',activo:'Tienda online con fichas y carrito',tools:'Shopify + Canva + Klaviyo',gpts:'Copywriter + Contenido + Atención + Analista',auto:'Carrito abandonado → email → cupón',metric:'Ventas, CAC, ROAS y ticket medio'}},edu:{n:'Educación / cursos',brief:'lead magnet, webinar y email',best:{canal:'YouTube/Reels + lead magnet',activo:'Landing de clase gratuita o webinar',tools:'Hotmart/Teachable + Canva + Synthesia',gpts:'Tutor + Copywriter + Vídeo + Analista',auto:'Registro → recordatorios → oferta',metric:'Registros, asistencia y ventas'}},local:{n:'Negocio local',brief:'Maps, reseñas, WhatsApp y reservas',best:{canal:'Google Maps + reseñas + WhatsApp',activo:'Perfil local + landing simple',tools:'Google Business + WhatsApp + Calendly',gpts:'Atención + Reseñas + Contenido local',auto:'Reserva → recordatorio → reseña',metric:'Reservas, llamadas y reseñas'}},alto:{n:'Alto ticket',brief:'landing específica, llamada rápida y CRM',best:{canal:'Google/Meta Ads + landing específica',activo:'Formulario corto + llamada de diagnóstico',tools:'Framer/Webflow + HubSpot + WhatsApp',gpts:'Ventas + Objeciones + Seguimiento',auto:'Lead → CRM → aviso inmediato → llamada',metric:'Tiempo de respuesta y cierre'}},turismo:{n:'Restauración / turismo',brief:'visual, reservas y reviews',best:{canal:'Google Maps + Instagram/TikTok',activo:'Carta/reserva + landing visual',tools:'Canva + CapCut + WhatsApp Business',gpts:'Contenido + Atención + Reseñas',auto:'Reserva → confirmación → reseña',metric:'Reservas, recurrencia y reviews'}},industria:{n:'Industria tradicional',brief:'autoridad, catálogo, presupuesto y CRM',best:{canal:'SEO + LinkedIn + ferias/email B2B',activo:'Web corporativa + catálogo descargable',tools:'Webflow + HubSpot + Airtable',gpts:'Estratega + Técnico + Ventas + Analista',auto:'Presupuesto → CRM → ficha interna',metric:'Solicitudes, CPL y pipeline'}}},choices:{canal:['LinkedIn + SEO + lead magnet','TikTok/Instagram + Google Shopping','Google Maps + reseñas + WhatsApp','YouTube/Reels + lead magnet','Google/Meta Ads + landing específica','SEO + LinkedIn + ferias/email B2B','Publicar al azar sin CTA'],activo:['Landing con formulario y llamada','Tienda online con fichas y carrito','Perfil local + landing simple','Landing de clase gratuita o webinar','Formulario corto + llamada de diagnóstico','Web corporativa + catálogo descargable','Web genérica sin CTA'],tools:['Webflow + HubSpot + Make','Shopify + Canva + Klaviyo','Hotmart/Teachable + Canva + Synthesia','Google Business + WhatsApp + Calendly','Framer/Webflow + HubSpot + WhatsApp','Webflow + HubSpot + Airtable','Solo ChatGPT sin CRM ni canal'],gpts:['Estratega + Copywriter + Ventas + Analista','Copywriter + Contenido + Atención + Analista','Tutor + Copywriter + Vídeo + Analista','Atención + Reseñas + Contenido local','Ventas + Objeciones + Seguimiento','Estratega + Técnico + Ventas + Analista','Un chat genérico para todo'],auto:['Formulario → CRM → email → tarea comercial','Carrito abandonado → email → cupón','Registro → recordatorios → oferta','Reserva → recordatorio → reseña','Lead → CRM → aviso inmediato → llamada','Presupuesto → CRM → ficha interna','Todo manual sin seguimiento'],metric:['Leads, CPL y tasa de cierre','Ventas, CAC, ROAS y ticket medio','Registros, asistencia y ventas','Reservas, llamadas y reseñas','Tiempo de respuesta y cierre','Solicitudes, CPL y pipeline','Likes sin ventas ni leads']}};let S={zone:'lobby',sector:null,score:0,bag:{},done:{}};const layer=document.getElementById('layer');function q(id){return document.getElementById(id)}function label(z){return{lobby:'Lobby',atrium:'Atrio',canal:'Canales',activo:'Activos',tools:'Herramientas',gpts:'GPTs',auto:'Automatización',metric:'Métricas',final:'Estrategia'}[z]||z}function ui(){q('sec').textContent=S.sector?DATA.sectors[S.sector].n:'sin elegir';q('pts').textContent=S.score;q('zone').textContent=label(S.zone);q('inv').innerHTML=Object.entries(S.bag).map(([k,v])=>'<span class="tag">'+k+': '+v+'</span>').join('')}function render(){ui();let z=S.zone;if(z==='lobby')layer.innerHTML='<div class="sign">exclusive<b>IA</b></div><div class="desk"></div><div class="npc" onclick="mentor()"><div class="face"></div><div class="body"></div></div><div class="portal p1" onclick="go(\'atrium\')">Entrar<br>al atrio</div>';else if(z==='atrium')layer.innerHTML='<div class="roomTitle">Atrio de Especialistas</div><div class="portal p3" onclick="go(\'canal\')">Canales</div><div class="portal p1" onclick="go(\'activo\')">Activos</div><div class="portal p2" onclick="go(\'tools\')">Herramientas</div><div class="portal p4" onclick="go(\'gpts\')">GPTs</div><div class="portal" style="left:220px;top:330px;transform:translateZ(30px)" onclick="go(\'auto\')">Automatización</div><div class="portal" style="left:570px;top:150px;height:150px;transform:translateZ(70px)" onclick="go(\'metric\')">Métricas</div><div class="portal" style="left:1080px;top:145px;height:160px;transform:translateZ(110px)" onclick="go(\'final\')">Estrategia<br>Final</div>';else layer.innerHTML='<div class="roomTitle">'+label(z)+'</div><div class="card">'+label(z)+'<br><span style="font-size:18px;color:#bfdbfe">Especialista interactivo</span></div><div class="npc" onclick="interact()"><div class="face"></div><div class="body"></div></div><div class="portal p1" onclick="go(\'atrium\')">Volver<br>al atrio</div>'}function go(z){S.zone=z;render();closeDlg()}function dialog(t,p,ops){q('dlg').classList.remove('hide');q('dt').textContent=t;q('dp').textContent=p;q('opts').innerHTML=ops.map((o,i)=>'<button onclick="_op['+i+']()">'+o[0]+'</button>').join('');window._op=ops.map(o=>o[1])}function closeDlg(){q('dlg').classList.add('hide')}function mentor(){dialog('Especialista de recepción','Elige el sector del cliente. La estrategia cambiará por ticket, canal y forma de decisión.',Object.entries(DATA.sectors).map(([k,v])=>[v.n,()=>{S.sector=k;S.score+=10;S.bag.sector=v.n;S.done.sector=1;go('atrium');dialog(v.n,'Brief: '+v.brief+'\n\nEntra a cada sala y recoge las decisiones necesarias.',[['Continuar',closeDlg]])}]))}function interact(){let z=S.zone;if(z==='final')return finish();if(!DATA.choices[z])return closeDlg();if(!S.sector)return dialog('Falta sector','Vuelve al lobby y habla con la especialista de recepción.',[['Cerrar',closeDlg]]);let order=['canal','activo','tools','gpts','auto','metric'],i=order.indexOf(z);if(i>0&&!S.done[order[i-1]])return dialog('Orden bloqueado','Primero completa: '+label(order[i-1]),[['Cerrar',closeDlg]]);dialog('Especialista de '+label(z),'Selecciona la opción correcta para '+DATA.sectors[S.sector].n+'.',DATA.choices[z].map(v=>[v,()=>pick(z,v)]))}function pick(k,v){let best=DATA.sectors[S.sector].best[k],bad=/azar|genérica|Solo|manual|Likes|genérico/.test(v),pts=v===best?20:(bad?-8:8);S.score=Math.max(0,S.score+pts);S.bag[k]=v;S.done[k]=1;ui();dialog((pts>0?'+':'')+pts+' puntos',v===best?'Correcto. Encaja con la estrategia.':pts>0?'Aceptable. Mejor opción: '+best:'Incorrecto. Mejor opción: '+best,[['Volver al atrio',()=>go('atrium')]])}function finish(){let miss=['sector','canal','activo','tools','gpts','auto','metric'].filter(k=>!S.bag[k]);if(miss.length)return dialog('Plan incompleto','Falta: '+miss.join(', '),[['Cerrar',closeDlg]]);dialog('Estrategia final','SECTOR: '+S.bag.sector+'\n\nCANAL: '+S.bag.canal+'\nACTIVO: '+S.bag.activo+'\nHERRAMIENTAS: '+S.bag.tools+'\nGPTS: '+S.bag.gpts+'\nAUTOMATIZACIÓN: '+S.bag.auto+'\nMÉTRICA: '+S.bag.metric+'\n\nPUNTOS: '+S.score,[['Nueva partida',()=>{S={zone:'lobby',sector:null,score:0,bag:{},done:{}};render();closeDlg()}]])}render();</script></body></html>
