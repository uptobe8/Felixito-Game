<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Felixito Game - Oficina Metaverso IA</title><style>:root{--gold:#ffd56a;--cyan:#7dd3fc;--glass:rgba(8,14,26,.72);--line:rgba(255,255,255,.22)}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020617;color:#fff;font-family:Inter,Arial,sans-serif}body{background:radial-gradient(circle at 50% 10%,#c7e6ff 0 10%,#3b6d8f 22%,#07111f 62%,#020617)}.ui{position:fixed;inset:0;pointer-events:none;z-index:20}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:10px;justify-content:space-between;align-items:center}.pill{background:rgba(4,8,18,.62);border:1px solid rgba(255,255,255,.24);box-shadow:0 18px 60px #0008,inset 0 1px 0 rgba(255,255,255,.25);backdrop-filter:blur(14px);border-radius:999px;padding:10px 14px;font-weight:900}.pill b{color:var(--gold)}.inv{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:7px;max-width:58vw}.tag{background:rgba(2,6,23,.72);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 10px;color:#dbeafe;font-size:12px}.hint{position:absolute;right:12px;bottom:12px;background:rgba(2,6,23,.72);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:10px 12px;color:#dbeafe}.world{position:absolute;inset:0;perspective:900px;perspective-origin:50% 42%;overflow:hidden}.stage{position:absolute;left:50%;top:54%;width:1400px;height:900px;transform-style:preserve-3d;transform:translate(-50%,-50%) rotateX(0deg)}.sky{position:absolute;inset:0;background:linear-gradient(#dff5ff 0 21%,#9ed0ea 22%,#20384e 62%,#020617);filter:saturate(1.1)}.sun{position:absolute;right:13%;top:9%;width:150px;height:150px;background:radial-gradient(circle,#fff 0,#fff7 30%,transparent 70%);filter:blur(3px)}.floor{position:absolute;left:50%;top:48%;width:1500px;height:900px;background:linear-gradient(135deg,#eee 0,#b8b8b8 42%,#5b6470 100%);transform:translateX(-50%) rotateX(72deg);transform-origin:50% 0;box-shadow:0 -30px 80px #fff4 inset}.floor:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px);background-size:110px 110px;mix-blend-mode:overlay}.floor:after{content:"";position:absolute;left:34%;top:4%;width:32%;height:110%;background:linear-gradient(90deg,transparent,#d0a15d88,transparent);transform:skewX(-10deg)}.back{position:absolute;left:50%;top:7%;width:980px;height:430px;transform:translateX(-50%) translateZ(-280px);background:linear-gradient(120deg,#f8fafc,#ddd 38%,#a9b2bd);border-radius:0 0 26px 26px;box-shadow:0 20px 80px #0008}.glassRoof{position:absolute;left:50%;top:-3%;width:880px;height:210px;transform:translateX(-50%) translateZ(-160px) rotateX(62deg);background:linear-gradient(135deg,rgba(255,255,255,.6),rgba(40,120,160,.22));border:5px solid #263447;border-radius:0 0 70px 70px;box-shadow:0 20px 80px #7dd3fc44}.glassRoof:before{content:"";position:absolute;inset:20px;background:repeating-linear-gradient(90deg,transparent 0 112px,#1f2937 115px 120px),repeating-linear-gradient(25deg,transparent 0 160px,#1f2937 164px 168px)}.leftWall,.rightWall{position:absolute;top:12%;width:360px;height:520px;background:linear-gradient(120deg,#f6f6f0,#aaa);box-shadow:0 20px 90px #0007}.leftWall{left:5%;transform:rotateY(48deg) translateZ(-120px)}.rightWall{right:5%;transform:rotateY(-48deg) translateZ(-120px)}.stone{background-image:radial-gradient(circle at 25% 25%,#fff 0 7%,transparent 8%),radial-gradient(circle at 70% 55%,#d8d8d8 0 9%,transparent 10%),linear-gradient(120deg,#f8fafc,#aaa)}.woodSlats{position:absolute;left:31%;top:9%;width:205px;height:300px;transform:translateZ(-190px);background:repeating-linear-gradient(90deg,#9a6a35 0 12px,transparent 12px 32px);filter:drop-shadow(0 15px 28px #0006)}.plant{position:absolute;left:8%;bottom:8%;width:230px;height:430px;transform:translateZ(60px)}.plant .trunk{position:absolute;bottom:0;left:92px;width:38px;height:260px;background:linear-gradient(90deg,#3f2b1e,#89603a);border-radius:26px}.leaf{position:absolute;width:210px;height:46px;background:linear-gradient(90deg,#0f3d23,#2fa35b);border-radius:100% 0 100% 0;transform-origin:12px 22px;filter:drop-shadow(0 10px 12px #0005)}.l1{left:85px;top:10px;transform:rotate(-35deg)}.l2{left:50px;top:75px;transform:rotate(-75deg)}.l3{left:85px;top:95px;transform:rotate(25deg)}.l4{left:15px;top:155px;transform:rotate(-125deg)}.desk{position:absolute;left:24%;top:55%;width:390px;height:125px;transform:translateZ(120px);background:linear-gradient(#d8c7b1,#9c744d);border-radius:12px;box-shadow:0 35px 70px #0008}.desk:before{content:"";position:absolute;inset:-12px 35px auto;height:20px;background:#f3eee7;border-radius:7px}.sign{position:absolute;left:29%;top:34%;transform:translateZ(80px);font-size:48px;font-weight:900;color:#253349;text-shadow:0 2px 0 #fff8}.sign span{color:#f43f5e}.portal{position:absolute;width:190px;height:310px;border-radius:28px;background:linear-gradient(150deg,rgba(15,23,42,.78),rgba(56,189,248,.16));border:2px solid rgba(255,255,255,.35);box-shadow:0 0 30px #7dd3fc66,inset 0 0 45px #ffffff22;cursor:pointer;pointer-events:auto;display:grid;place-items:center;text-align:center;padding:14px;font-weight:900;color:#fff;text-shadow:0 2px 8px #000}.portal:hover{box-shadow:0 0 50px #facc15,0 0 120px #7dd3fc88;transform:translateZ(170px) scale(1.04)!important}.p1{left:58%;top:36%;transform:translateZ(80px)}.p2{left:73%;top:34%;transform:translateZ(40px)}.p3{left:44%;top:34%;transform:translateZ(35px)}.p4{left:86%;top:35%;transform:translateZ(15px)}.avatar{position:absolute;left:50%;bottom:9%;width:130px;height:300px;transform:translateX(-50%) translateZ(310px);filter:drop-shadow(0 26px 24px #0008);z-index:2}.head{position:absolute;left:41px;top:8px;width:58px;height:72px;background:linear-gradient(#d7b093,#a86f50);border-radius:48% 48% 44% 44%}.hair{position:absolute;left:30px;top:0;width:78px;height:90px;background:linear-gradient(135deg,#3b241a,#7c4a32);border-radius:48% 48% 35% 35%;clip-path:polygon(16% 0,84% 0,100% 86%,62% 76%,44% 100%,0 84%)}.torso{position:absolute;left:25px;top:80px;width:85px;height:128px;background:linear-gradient(90deg,#f1f5f9,#cbd5e1);border-radius:36px 36px 18px 18px}.legs{position:absolute;left:36px;top:204px;width:66px;height:88px;background:linear-gradient(90deg,#c8a77b,#8a623d);clip-path:polygon(0 0,45% 0,42% 100%,7% 100%,20% 35%,55% 35%,72% 100%,100% 100%,88% 0)}.arm{position:absolute;top:95px;width:26px;height:110px;background:linear-gradient(#d7b093,#a86f50);border-radius:20px}.a1{left:6px;transform:rotate(13deg)}.a2{right:0;transform:rotate(-13deg)}.npc{position:absolute;right:22%;bottom:20%;width:110px;height:250px;transform:translateZ(110px);filter:drop-shadow(0 25px 25px #0008)}.npc .body{position:absolute;left:24px;top:80px;width:64px;height:118px;background:linear-gradient(#0f172a,#020617);border-radius:30px 30px 12px 12px}.npc .face{position:absolute;left:30px;top:28px;width:52px;height:62px;background:#d9b08c;border-radius:50%}.npc:after{content:"Especialista";position:absolute;left:-18px;top:0;font-weight:900;color:#fff;text-shadow:0 2px 8px #000}.roomTitle{position:absolute;left:50%;top:16%;transform:translateX(-50%) translateZ(240px);font-size:46px;font-weight:900;text-shadow:0 10px 40px #000}.focusCard{position:absolute;left:20%;top:36%;width:330px;min-height:180px;transform:translateZ(150px);background:rgba(2,6,23,.56);border:1px solid rgba(255,255,255,.32);box-shadow:0 30px 90px #0009,inset 0 1px 0 #fff3;border-radius:24px;padding:28px;font-size:30px;font-weight:900}.dlg{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(980px,calc(100vw - 22px));max-height:52vh;overflow:auto;background:rgba(3,7,18,.9);border:1px solid rgba(255,255,255,.28);border-radius:22px;box-shadow:0 30px 90px #000d;padding:16px;z-index:30}.dlg.hide{display:none}.dlg h2{margin:0 40px 8px 0;color:var(--gold)}.dlg p{white-space:pre-wrap;color:#dbeafe}.x{position:absolute;right:12px;top:12px;border:1px solid #64748b;background:#020617;color:#fff;border-radius:99px;width:34px;height:34px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.opts button{border:1px solid #475569;background:linear-gradient(#1f2937,#0f172a);color:#fff;border-radius:14px;padding:12px;text-align:left;font-weight:800}.opts button:hover{border-color:var(--gold)}@media(max-width:850px){.stage{transform:translate(-50%,-50%) scale(.82)}.opts{grid-template-columns:1fr}.top{flex-wrap:wrap;font-size:12px}.hint,.inv{display:none}.dlg{bottom:8px}}</style></head><body><div class="sky"></div><div class="sun"></div><div class="world"><div class="stage" id="stage"><div class="glassRoof"></div><div class="back stone"></div><div class="leftWall stone"></div><div class="rightWall stone"></div><div class="woodSlats"></div><div class="floor"></div><div class="plant"><div class="trunk"></div><i class="leaf l1"></i><i class="leaf l2"></i><i class="leaf l3"></i><i class="leaf l4"></i></div><div id="sceneLayer"></div><div class="avatar"><div class="hair"></div><div class="head"></div><div class="torso"></div><div class="arm a1"></div><div class="arm a2"></div><div class="legs"></div></div></div></div><div class="ui"><div class="top"><div class="pill">Felixito Metaverse Office</div><div class="pill">Sector: <b id="sec">sin elegir</b></div><div class="pill">Puntos: <b id="pts">0</b></div><div class="pill">Zona: <b id="zone">Lobby</b></div></div><div class="inv" id="inv"></div><div class="hint">Haz clic en portales o especialistas</div></div><div class="dlg" id="dlg"><button class="x" onclick="closeDlg()">×</button><h2 id="dt">Lobby de Digitalización IA</h2><p id="dp">Entra en la oficina metaverso. Habla con la especialista de recepción para elegir sector y visita las salas.</p><div class="opts" id="opts"><button onclick="closeDlg()">Empezar</button></div></div><script>const DATA={sectors:{b2b:{n:'B2B / consultoría',brief:'autoridad, lead magnet, email y llamada',best:{canal:'LinkedIn + SEO + lead magnet',activo:'Landing con formulario y llamada',tools:'Webflow + HubSpot + Make',gpts:'Estratega + Copywriter + Ventas + Analista',auto:'Formulario → CRM → email → tarea comercial',metric:'Leads, CPL y tasa de cierre'}},ecom:{n:'B2C ecommerce',brief:'tienda, social commerce y recuperación de carrito',best:{canal:'TikTok/Instagram + Google Shopping',activo:'Tienda online con fichas y carrito',tools:'Shopify + Canva + Klaviyo',gpts:'Copywriter + Contenido + Atención + Analista',auto:'Carrito abandonado → email → cupón',metric:'Ventas, CAC, ROAS y ticket medio'}},edu:{n:'Educación / cursos',brief:'lead magnet, webinar y email',best:{canal:'YouTube/Reels + lead magnet',activo:'Landing de clase gratuita o webinar',tools:'Hotmart/Teachable + Canva + Synthesia',gpts:'Tutor + Copywriter + Vídeo + Analista',auto:'Registro → recordatorios → oferta',metric:'Registros, asistencia y ventas'}},local:{n:'Negocio local',brief:'Maps, reseñas, WhatsApp y reservas',best:{canal:'Google Maps + reseñas + WhatsApp',activo:'Perfil local + landing simple',tools:'Google Business + WhatsApp + Calendly',gpts:'Atención + Reseñas + Contenido local',auto:'Reserva → recordatorio → reseña',metric:'Reservas, llamadas y reseñas'}},alto:{n:'Inmobiliaria / reformas / alto ticket',brief:'landing específica, llamada rápida y CRM',best:{canal:'Google/Meta Ads + landing específica',activo:'Formulario corto + llamada de diagnóstico',tools:'Framer/Webflow + HubSpot + WhatsApp',gpts:'Ventas + Objeciones + Seguimiento',auto:'Lead → CRM → aviso inmediato → llamada',metric:'Tiempo de respuesta y cierre'}},turismo:{n:'Restauración / turismo',brief:'visual, reservas y reviews',best:{canal:'Google Maps + Instagram/TikTok',activo:'Carta/reserva + landing visual',tools:'Canva + CapCut + WhatsApp Business',gpts:'Contenido + Atención + Reseñas',auto:'Reserva → confirmación → reseña',metric:'Reservas, recurrencia y reviews'}},industria:{n:'Industria tradicional',brief:'autoridad, catálogo, presupuesto y CRM',best:{canal:'SEO + LinkedIn + ferias/email B2B',activo:'Web corporativa + catálogo descargable',tools:'Webflow + HubSpot + Airtable',gpts:'Estratega + Técnico + Ventas + Analista',auto:'Presupuesto → CRM → ficha interna',metric:'Solicitudes, CPL y pipeline'}}},choices:{canal:['LinkedIn + SEO + lead magnet','TikTok/Instagram + Google Shopping','Google Maps + reseñas + WhatsApp','YouTube/Reels + lead magnet','Google/Meta Ads + landing específica','SEO + LinkedIn + ferias/email B2B','Publicar al azar sin CTA'],activo:['Landing con formulario y llamada','Tienda online con fichas y carrito','Perfil local + landing simple','Landing de clase gratuita o webinar','Formulario corto + llamada de diagnóstico','Web corporativa + catálogo descargable','Web genérica sin CTA'],tools:['Webflow + HubSpot + Make','Shopify + Canva + Klaviyo','Hotmart/Teachable + Canva + Synthesia','Google Business + WhatsApp + Calendly','Framer/Webflow + HubSpot + WhatsApp','Webflow + HubSpot + Airtable','Solo ChatGPT sin CRM ni canal'],gpts:['Estratega + Copywriter + Ventas + Analista','Copywriter + Contenido + Atención + Analista','Tutor + Copywriter + Vídeo + Analista','Atención + Reseñas + Contenido local','Ventas + Objeciones + Seguimiento','Estratega + Técnico + Ventas + Analista','Un chat genérico para todo'],auto:['Formulario → CRM → email → tarea comercial','Carrito abandonado → email → cupón','Registro → recordatorios → oferta','Reserva → recordatorio → reseña','Lead → CRM → aviso inmediato → llamada','Presupuesto → CRM → ficha interna','Todo manual sin seguimiento'],metric:['Leads, CPL y tasa de cierre','Ventas, CAC, ROAS y ticket medio','Registros, asistencia y ventas','Reservas, llamadas y reseñas','Tiempo de respuesta y cierre','Solicitudes, CPL y pipeline','Likes sin ventas ni leads']}};let S={zone:'lobby',sector:null,score:0,bag:{},done:{}};const layer=document.getElementById('sceneLayer');function q(id){return document.getElementById(id)}function ui(){q('sec').textContent=S.sector?DATA.sectors[S.sector].n:'sin elegir';q('pts').textContent=S.score;q('zone').textContent=label(S.zone);q('inv').innerHTML=Object.entries(S.bag).map(([k,v])=>'<span class="tag">'+k+': '+v+'</span>').join('')}function label(z){return{lobby:'Lobby',atrium:'Atrio',canal:'Canales',activo:'Activos',tools:'Herramientas',gpts:'GPTs',auto:'Automatización',metric:'Métricas',final:'Estrategia'}[z]||z}function render(){ui();let z=S.zone;if(z==='lobby'){layer.innerHTML='<div class="sign">exclusive<span>IA</span></div><div class="desk"></div><div class="npc" onclick="mentor()"><div class="face"></div><div class="body"></div></div><div class="portal p1" onclick="go(\'atrium\')">Entrar al atrio</div>'}else if(z==='atrium'){layer.innerHTML='<div class="roomTitle">Atrio de Especialistas</div><div class="portal p3" onclick="go(\'canal\')">Sala<br>Canales</div><div class="portal p1" onclick="go(\'activo\')">Activos<br>Digitales</div><div class="portal p2" onclick="go(\'tools\')">Herramientas<br>IA</div><div class="portal p4" onclick="go(\'gpts\')">GPTs<br>Especialistas</div><div class="portal" style="left:16%;top:34%;transform:translateZ(30px)" onclick="go(\'auto\')">Automatización</div><div class="portal" style="left:42%;top:15%;height:150px;transform:translateZ(70px)" onclick="go(\'metric\')">Métricas</div><div class="portal" style="left:82%;top:14%;height:160px;transform:translateZ(110px)" onclick="go(\'final\')">Estrategia<br>Final</div>'}else{let title=label(z);layer.innerHTML='<div class="roomTitle">'+title+'</div><div class="focusCard">'+title+'<br><span style="font-size:18px;color:#bfdbfe">Especialista interactivo</span></div><div class="npc" onclick="interact()"><div class="face"></div><div class="body"></div></div><div class="portal p1" onclick="go(\'atrium\')">Volver<br>al atrio</div>'}}function go(z){S.zone=z;render();closeDlg()}function dialog(t,p,ops){q('dlg').classList.remove('hide');q('dt').textContent=t;q('dp').textContent=p;q('opts').innerHTML=ops.map((o,i)=>'<button onclick="_op['+i+']()">'+o[0]+'</button>').join('');window._op=ops.map(o=>o[1])}function closeDlg(){q('dlg').classList.add('hide')}function mentor(){dialog('Especialista de recepción','Elige el sector del cliente. La estrategia cambiará por ticket, canal y forma de decisión.',Object.entries(DATA.sectors).map(([k,v])=>[v.n,()=>{S.sector=k;S.score+=10;S.bag.sector=v.n;S.done.sector=1;go('atrium');dialog(v.n,'Brief: '+v.brief+'\n\nEntra a cada sala y recoge las decisiones necesarias.',[['Continuar',closeDlg]])}]))}function interact(){let z=S.zone;if(z==='final')return finish();if(!DATA.choices[z])return closeDlg();if(!S.sector)return dialog('Falta sector','Vuelve al lobby y habla con la especialista de recepción.',[['Cerrar',closeDlg]]);let order=['canal','activo','tools','gpts','auto','metric'],i=order.indexOf(z);if(i>0&&!S.done[order[i-1]])return dialog('Orden bloqueado','Primero completa: '+label(order[i-1]),[['Cerrar',closeDlg]]);dialog('Especialista de '+label(z),'Selecciona la opción correcta para '+DATA.sectors[S.sector].n+'.',DATA.choices[z].map(v=>[v,()=>pick(z,v)]))}function pick(k,v){let best=DATA.sectors[S.sector].best[k],bad=/azar|genérica|Solo|manual|Likes|genérico/.test(v),pts=v===best?20:(bad?-8:8);S.score=Math.max(0,S.score+pts);S.bag[k]=v;S.done[k]=1;ui();dialog((pts>0?'+':'')+pts+' puntos',v===best?'Correcto. Encaja con la estrategia.':pts>0?'Aceptable. Mejor opción: '+best:'Incorrecto. Mejor opción: '+best,[['Volver al atrio',()=>go('atrium')]])}function finish(){let miss=['sector','canal','activo','tools','gpts','auto','metric'].filter(k=>!S.bag[k]);if(miss.length)return dialog('Plan incompleto','Falta: '+miss.join(', '),[['Cerrar',closeDlg]]);dialog('Estrategia final','SECTOR: '+S.bag.sector+'\n\nCANAL: '+S.bag.canal+'\nACTIVO: '+S.bag.activo+'\nHERRAMIENTAS: '+S.bag.tools+'\nGPTS: '+S.bag.gpts+'\nAUTOMATIZACIÓN: '+S.bag.auto+'\nMÉTRICA: '+S.bag.metric+'\n\nPUNTOS: '+S.score,[['Nueva partida',()=>{S={zone:'lobby',sector:null,score:0,bag:{},done:{}};render();closeDlg()}]])}render();</script></body></html>
